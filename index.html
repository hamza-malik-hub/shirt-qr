<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: white;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
        }
    </style>
</head>

<body>

<img id="funnyImage" src="" alt="">

<script>
    const params = new URLSearchParams(window.location.search);
    let id = parseInt(params.get("id"));

    if (isNaN(id) || id < 1 || id > 20) {
        id = 1;
    }

    document.getElementById("funnyImage").src = id + ".jpg";
</script>

</body>
</html>
